<style>
:root{--red:#d92338;--red-dark:#ad182b;--pink:#fff0f2;--ink:#222b36;--muted:#697582;--line:#e7e9ee;--bg:#f5f6f9;--green:#217351;--shadow:0 4px 20px #27314206}*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e68693;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit}button{transition:background .16s,transform .16s,box-shadow .16s}button:hover{filter:brightness(.98)}.preview-bar{min-height:42px;background:#252c36;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 24px;font-size:12px}.preview-bar span{color:#d0d5dd}.preview-bar button{background:#ffffff15;border:1px solid #ffffff35;border-radius:6px;color:white;padding:3px 12px}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 42px)}aside{padding:26px 18px;background:white;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}.brand img{width:42px;height:48px;object-fit:contain}.brand strong{font-size:15px;letter-spacing:-.3px}.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;font-weight:750;color:var(--red)}.nav-label{font-size:10px;letter-spacing:1.4px;color:#939ba5;margin:0 12px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;border-radius:8px;padding:11px 12px;color:var(--muted);display:flex;align-items:center;gap:11px}.nav button.active{background:var(--pink);color:var(--red);font-weight:650}.nav svg{width:17px;height:17px}.aside-bottom{margin-top:auto;padding:36px 12px 0;color:var(--muted);font-size:12px}.workspace{min-width:0}.topbar{height:67px;background:white;border-bottom:1px soli px;margin-bottom:18px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}select,input{border:1px solid var(--line);background:white;border-radius:7px;padding:8px 10px;color:var(--ink);font-size:12px}.badge{padding:4px 8px;border-radius:5px;background:#edf7f1;color:var(--green);font-size:10px;font-weight:650;white-space:nowrap}.badge.red{background:var(--pink);color:var(--red)}.badge.amber{background:#fff5e3;color:#95661b}.grid{display:grid;gap:18px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);min-width:0}.stat{padding:17px 20px}.stat-label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.stat strong{display:block;font-size:27px;letter-spacing:-1px;margin:7px 0 3px}.stat small{font-size:10px;color:var(--muted)}.stat small.green{color:var(--green)}.charts{grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr)}.cardhead{padding:18px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.cardhead p{margin-top:3px}.cardbody{padding:18px 20px}.legend{display:flex;gap:15px;font-size:10px;color:var(--muted);margin:12px 0 0}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px}.legend .faint{background:#b5bdc7}.chart{width:100%;height:auto;display:block}.chart text{fill:var(--muted);font:11px 'Segoe UI',sans-serif}.chart .chart-point{fill:white;stroke:var(--red);stroke-width:2;cursor:pointer}.chart .chart-point:hover,.chart .chart-point:focus{fill:var(--red);outline:none}.chart-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:10px 20px;font-size:11px;color:var(--muted);gap:12px}.bar-row{margin:16px 0 20px}.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.track{height:7px;border-radius:8px;background:#f0f2f5;overflow:hidden}.fill{height:100%;border-radius:8px;background:var(--red)}.bottom-grid{grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);margin-top:18px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{font-size:10px;color:var(--muted);font-weight:600;background:#fafbfc}td,th{padding:12px 16px;border-bottom:1px solid #f0f1f4}tr:last-child td{border:0}.table-wrap{overflow:auto;margin-top:14px}.note{padding:14px;background:#fbf5f1;border-radius:8px;margin-top:14px;font-size:12px;line-height:1.7}.note strong{display:block;margin-bottom:5px}.section{animation:appear .2s ease-out}@keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}.heat{display:grid;grid-template-columns:55px repeat(6,minmax(32px,1fr));gap:8px;margin:18px 0}.heat div{text-align:center;padding:10px 2px;font-size:11px;border-radius:4px}.heat .cell{color:#8b1630;cursor:default}.report-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.report-option{padding:20px}.report-option p{margin:8px 0 20px;min-height:42px}.welcome{padding:24px;background:linear-gradient(115deg,#fff0f2,#fff 80%);display:flex;justify-content:space-between;align-items:center;gap:18px}.welcome h2{font-size:22px;margin-bottom:6px}.event-list{display:grid;gap:12px}.event{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;align-items:center;gap:14px}.date-tile{min-width:46px;text-align:center;background:var(--pink);color:var(--red);border-radius:7px;padding:7px}.date-tile strong{display:block;font-size:21px;line-height:1.2}.date-tile small{font-size:9px;font-weight:700}.event .btn{margin-left:auto}.event p{font-size:11px;color:var(--muted);margin-top:4px}.personal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.personal-stats .stat{padding:16px}.certificate-mini{border:1px solid #dfd4bd;background:#fffefa;text-align:center;padding:30px 20px;position:relative;outline:1px solid #eee1ca;outline-offset:-8px}.certificate-mini h3{font:27px Georgia,serif;margin:12px 0}.certificate-mini p{font-size:11px;color:var(--muted);margin:8px 0}.certificate-mini strong{font:22px Georgia,serif}.certificate-mini img{width:42px;height:50px;object-fit:contain}.cert-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}.notice{display:flex;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.notice:last-child{border:0}.notice-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--pink);color:var(--red);flex-shrink:0}.notice p{font-size:12px;color:var(--muted);margin:4px 0}.notice small{font-size:10px;color:var(--muted)}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.toggle-row p{margin-top:3px}.switch{width:35px;height:21px;accent-color:var(--red);cursor:pointer}.mobile-nav{display:none}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:9px;background:#24382d;color:white;box-shadow:0 8px 30px #0002;z-index:50;font-size:12px;max-width:90vw}.toast[hidden]{display:none}dialog{width:min(650px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:12px;padding:22px;color:var(--ink);overflow:auto}dialog::backdrop{background:#19232f80;backdrop-filter:blur(3px)}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.certificate-full{padding:45px 30px}.certificate-full h3{font-size:34px}.certificate-full .cert-line{width:100px;height:2px;background:#c2a974;margin:20px auto}.phase{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.phase-number{width:26px;height:26px;display:grid;place-items:center;background:var(--pink);color:var(--red);border-radius:50%;font-weight:bold}.phase p{font-size:12px;color:var(--muted)}.plan-link{margin-top:20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.mobile-menu{display:none}.empty-card{padding:32px}.print-note{font-size:10px;color:var(--red);margin-top:14px}.filter-panel{padding:16px;margin-bottom:18px}.filter-panel label{display:grid;gap:5px;color:var(--muted);font-size:11px}.filter-panel[hidden]{display:none}
@media(min-width:1500px){main{padding-top:35px}.charts .cardbody{padding-top:22px}}
@media(max-width:1100px){.app{grid-template-columns:190px minmax(0,1fr)}main{padding:24px}.topbar{padding:0 24px}.charts,.bottom-grid{grid-template-columns:minmax(0,1.5fr) minmax(235px,1fr)}.stat{padding:14px}.stat strong{font-size:24px}.report-options{grid-template-columns:1fr}}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}aside.open{display:flex;position:fixed;inset:42px 0 auto;z-index:20;box-shadow:0 10px 30px #0002}.aside-bottom{display:none}.brand{margin-bottom:18px}.mobile-menu{display:block}.topbar{height:auto;min-height:62px;padding:10px 16px}.topbar small,.topbar .avatar{display:none}.topright{gap:8px}main{padding:22px 16px 90px}.pagehead{align-items:flex-start}h1{font-size:25px}.charts,.bottom-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{align-items:flex-start;flex-direction:column}.preview-bar{padding:8px 12px}.preview-bar span{display:none}.tabs{gap:22px}.welcome{padding:20px}.welcome .btn{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:8px 8px max(8px,env(safe-area-inset-bottom));justify-content:space-around;z-index:15}.mobile-nav button{background:none;border:0;display:grid;justify-items:center;gap:3px;font-size:9px;color:var(--muted);padding:4px 8px}.mobile-nav button.active{color:var(--red)}.mobile-nav svg{width:19px;height:19px}.personal-stats .stat{padding:11px}.personal-stats .stat-label{font-size:10px}.event{flex-wrap:wrap}.event .btn{margin-left:60px}.pagehead>.btn{padding:8px;font-size:11px}.toast{bottom:85px}.certificate-full{padding:30px 14px}.heat{gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div class="preview-bar"><div><b>DESIGN PREVIEW</b> <span> · Sample data only · Controls demonstrate the proposed experience</span></div><button onclick="showPlan()">Build plan ↗</button></div>
<div class="app"><aside id="sidebar"><div class="brand"><img src="../public/Ladles-logo.png" alt="Ladles of Love"><div><strong>LADLES OF LOVE</strong><div class="eyebrow">Volunteer portal</div></div></div><p class="nav-label" id="nav-label">ADMIN WORKSPACE</p><nav class="nav" id="nav" aria-label="Main navigation"></nav><div class="aside-bottom">Small actions.<br><strong>Lasting community impact.</strong><div class="plan-link"><button class="btn" onclick="showPlan()">View implementation plan</button></div></div></aside>
<div class="workspace"><header class="topbar"><div class="row"><button class="btn mobile-menu" aria-label="Toggle menu" aria-expanded="false" onclick="toggleMenu(this)">☰</button><small id="breadcrumb">Workspace / Analytics & reports</small></div><div class="topright"><div class="role-switch" aria-label="Preview role"><button id="admin-role" class="selected" onclick="setRole('admin')">Admin</button><button id="volunteer-role" onclick="setRole('volunteer')">Volunteer</button></div><button class="bell" aria-label="Open notifications" onclick="navigate('notifications')"><span id="bell-icon"></span><span class="dot" id="unread-dot"></span></button><div class="avatar" id="avatar">FM</div></div></header><main id="main"></main></div></div>
<nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav><div class="toast" role="status" id="toast" hidden></div>
<dialog id="dialog"><div class="dialoghead"><h2 id="dialog-title">Preview</h2><button class="btn" onclick="document.getElementById('dialog').close()" aria-label="Close dialog">✕</button></div><div id="dialog-content"></div></dialog>
<script>
const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',analytics:'M4 3v17h17 M8 15l4-6 4 3 5-8',calendar:'M4 5h16v16H4z M4 10h16 M8 3v4 M16 3v4',reports:'M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7',heart:'M12 21S2 14 2 7a5 5 0 0 1 10-1A5 5 0 0 1 22 7c0 7-10 14-10 14z',bell:'M5 17h14l-2-3V9a5 5 0 0 0-10 0v5z M10 20h4',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M17 4a4 4 0 0 1 0 8 M18 15a4 4 0 0 1 4 4v2',download:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',scan:'M8 3H3v5 M16 3h5v5 M3 16v5h5 M21 16v5h-5 M5 12h14',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.dashboard}"/></svg>`;
let role='admin',page='analytics',tab='overview',period='6',toastTimer; const months=['Apr','May','Jun','Jul','Aug','Sep'];const participation=[82,104,91,145,132,168];
const plans=[['Visual foundation & navigation','Agree colours, typography, spacing and card sizes. Standardise headers, mobile navigation, focus states and responsive layouts.'],['Analytics & reports','Connect compact charts to verified data; clarify filters, metric definitions and exports. Include loading, empty and error states.'],['Certificates & hours reports','Agree eligibility and wording. Build certificate preview and PDF output, plus a separate detailed hours report based on completed attendance.'],['Volunteer experience','Apply the visual system to opportunities, booking details, attendance and personal progress. Keep primary actions easy to reach on mobile.'],['Admin workflows','Polish events, rosters and corporate screens with consistent tables, search, statuses and focused forms. Preserve WMS ownership rules.'],['Notifications & reminders','Finish the notification centre and confirmations. Agree channels, schedule and timezone; connect delivery with duplicate prevention and failure handling.'],['Final checks & release','Verify data accuracy, booking/capacity behaviour, access controls, printing, keyboard use, reduced motion and mobile layouts. Deploy after review.']];
function setRole(value){role=value;page=value==='admin'?'analytics':'home';render()}
function navigate(value){page=value;document.getElementById('sidebar').classList.remove('open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'instant'})}
function toggleMenu(button){const open=document.getElementById('sidebar').classList.toggle('open');button.setAttribute('aria-expanded',String(open))}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4200)}
function openDialog(title,content){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=content;document.getElementById('dialog').showModal()}
function showPlan(){openDialog('How we would build this',`<p class="muted">Reviewable phases. This preview does not connect to live accounts, bookings or delivery services.</p>${plans.map((p,i)=>`<div class="phase"><div class="phase-number">${i+1}</div><div><h3>${p[0]}</h3><p>${p[1]}</p></div></div>`).join('')}`)}
function header(title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${role==='admin'?'Your community, in focus':'Every hour makes a difference'}</div><h1>${title}</h1><p class="muted">${desc}</p></div>${action}</div>`}
function stat(label,value,detail){return `<div class="card stat"><div class="stat-label">${label}</div><strong>${value}</strong><small>${detail}</small></div>`}
function lineChart(){const offset=period==='3'?3:0,values=participation.slice(offset);const pts=values.map((v,i)=>[45+i*560/(values.length-1),190-v*.8]);return `<svg class="chart" viewBox="0 0 650 228" role="img" aria-label="Sample monthly participation chart. April 82; May 104; June 91; July 145; August 132; September 168."><defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d92338" stop-opacity=".13"/><stop offset="1" stop-color="#d92338" stop-opacity="0"/></linearGradient></defs>${[0,50,100,150,200].map(v=>`<line x1="45" x2="605" y1="${190-v*.8}" y2="${190-v*.8}" stroke="#e9ecf0" stroke-dasharray="3 5"/><text x="30" y="${194-v*.8}" text-anchor="end">${v}</text>`).join('')}<path d="M45 190 L${pts.map(p=>p.join(' ')).join(' L')} L605 190 Z" fill="url(#wash)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#d92338" stroke-width="2.5"/>${pts.map((p,i)=>`<circle class="chart-point" tabindex="0" cx="${p[0]}" cy="${p[1]}" r="4" onfocus="pointDetail(${i+offset})" onmouseenter="pointDetail(${i+offset})"><title>${months[i+offset]}: ${values[i]} volunteers</title></circle><text x="${p[0]}" y="217" text-anchor="middle">${months[i+offset]}</text>`).join('')}</svg>`}
function pointDetail(i){document.getElementById('chart-detail').textContent=`${months[i]} 2026 · ${participation[i]} unique volunteers`}
function analytics(){const count=period==='3'?'360':'426';return header('Analytics & reports','Understand participation. See where your community makes a difference.',`<button class="btn" onclick="tab='exports';render()">${icon('download')} Export report</button>`)+`<div class="tabs" aria-label="Analytics views">${[['overview','Overview'],['heatmap','Attendance heatmap'],['events','Event performance'],['exports','Reports & exports']].map(([id,label])=>`<button class="${tab===id?'active':''}" aria-pressed="${tab===id}" onclick="tab='${id}';render()">${label}</button>`).join('')}</div><div class="toolbar"><div class="controls"><select aria-label="Reporting period" onchange="period=this.value;render()"><option value="6" ${period==='6'?'selected':''}>Apr – Sep 2026</option><option value="3" ${period==='3'?'selected':''}>Jul – Sep 2026</option></select><span class="muted">All locations · All programmes</span></div><span class="badge amber">Illustrative data</span></div>${tab==='exports'?reports():tab==='heatmap'?heatmap():tab==='events'?eventTable():`<div class="grid kpis">${stat('Unique volunteers',count,'Counted once across this period')}${stat('Verified hours',period==='3'?'1,284':'2,184','Completed individual shifts')}${stat('Recorded attendance',period==='3'?'445':'722','Attendance instances, including groups')}${stat('Completed events',period==='3'?'27':'48','Within the selected period')}</div><div class="grid charts"><section class="card"><div class="cardhead"><div><h2>Volunteer participation</h2><p class="muted">Unique volunteers with a recorded clock-in each month</p></div></div><div class="cardbody"><div class="legend"><span><i></i>Unique volunteers</span></div>${lineChart()}</div><div class="chart-foot"><span id="chart-detail">Sep 2026 · 168 unique volunteers</span><span>Monthly counts are not additive</span></div></section><section class="card"><div class="cardhead"><div><h2>Hours by programme</h2><p class="muted">Completed individual volunteer hours</p></div></div><div class="cardbody">${[['Dignity Kitchen',48,'1,048'],['Warehouse',30,'655'],['Community campaigns',15,'328'],['Feed the Soil',7,'153']].map(([name,pct,v])=>`<div class="bar-row"><div class="bar-label"><span>${name}</span><strong>${period==='3'?Math.round(Number(String(v).replace(',',''))*.588):v} h</strong></div><div class="track"><div class="fill" style="width:${pct*2}%;opacity:${.4+pct/80}"></div></div></div>`).join('')}<p class="muted">Corporate group hours appear separately in reports.</p></div></section></div><div class="grid bottom-grid">${eventTable(true)}<section class="card"><div class="cardhead"><h2>What the numbers tell us</h2></div><div class="cardbody"><div class="note"><strong>September had the most participants</strong>168 volunteers recorded attendance, compared with 132 in August.</div><div class="note"><strong>Kitchen shifts lead recorded hours</strong>Dignity Kitchen accounts for approximately 48% of individual hours in this sample.</div><p class="muted" style="margin-top:12px">Simple observations calculated from data. No predictive claims.</p></div></section></div>`}`}
function eventTable(short=false){return `<section class="card"><div class="cardhead"><div><h2>${short?'Recent event performance':'Event performance'}</h2><p class="muted">Sample completed events · attendance and verified individual hours</p></div>${short?'<button class="btn" onclick="tab=\'events\';render()">View all</button>':''}</div><div class="table-wrap"><table><thead><tr><th>Event</th><th>Booked</th><th>Attended</th><th>Hours</th></tr></thead><tbody>${[['Kitchen prep · Cape Town',30,28,84],['Warehouse packing · HQ',24,22,66],['Community campaign',40,35,105]].map(r=>`<tr>${r.map((v,i)=>`<td>${i===0?'<strong>'+v+'</strong>':v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function heatmap(){let cells='<div></div>'+['08:00','10:00','12:00','14:00','16:00','18:00'].map(s=>`<div>${s}</div>`).join('');['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((day,d)=>{cells+=`<div>${day}</div>`;for(let h=0;h<6;h++){let n=(d*11+h*7+9)%43;cells+=`<div class="cell" style="background:rgba(217,35,56,${.05+n/65})" title="${day}, ${8+h*2}:00: ${n} attendance instances">${n}</div>`}});return `<section class="card"><div class="cardhead"><div><h2>When volunteers take part</h2><p class="muted">Attendance grouped by weekday and scheduled shift start · South African time</p></div></div><div class="cardbody"><div class="heat">${cells}</div><p class="muted">Darker cells mean more recorded attendance. These are illustrative totals.</p></div></section>`}
function reports(){return `<div class="grid report-options">${[['Event performance','Capacity, bookings, attendance and hours for the reporting period.','CSV'],['Corporate impact','Company participation, group attendance and recorded corporate hours.','Preview'],['Volunteer hours','A clear record of completed shifts and verified volunteer time.','PDF preview']].map(([title,desc,action],i)=>`<section class="card report-option"><div class="eyebrow">${i===0?'Spreadsheet ready':'Document preview'}</div><h2 style="margin-top:10px">${title}</h2><p class="muted">${desc}</p><button class="btn ${i===0?'primary':''}" onclick="${i===0?'downloadCsv()':i===1?'corporatePreview()':'hoursPreview()'}">${icon('download')} ${action}</button></section>`).join('')}</div><section class="card" style="margin-top:18px"><div class="cardbody"><h3>Know what you’re downloading</h3><p class="muted">In the finished app, exports will use the selected filters and identify the date range, generation date and calculation rules. This preview exports labelled sample data only.</p></div></section>`}
function home(){return header('Welcome back, Alex','Your next opportunity to make a difference is just around the corner.')+`<section class="card welcome"><div><span class="badge">YOUR NEXT SHIFT</span><h2 style="margin-top:12px">Kitchen prep & meal packing</h2><p class="muted">Saturday, 3 October · 09:00–12:00 · Cape Town</p></div><button class="btn primary" onclick="shiftDetails()">View my shift →</button></section><div class="personal-stats">${stat('Verified hours','24','Across completed shifts')}${stat('Completed shifts','8','Thank you for showing up')}${stat('Upcoming shifts','2','Your places are reserved')}</div><div class="grid charts"><section class="card"><div class="cardhead"><div><h2>Find your next opportunity</h2><p class="muted">A little of your time can make a big difference.</p></div></div><div class="cardbody event-list">${[['03','OCT','Dignity Kitchen','Cape Town · 09:00–12:00'],['10','OCT','Warehouse packing','Warehouse HQ · 10:00–13:00'],['17','OCT','Community food drive','Cape Town · 08:00–11:00']].map(([d,m,n,l])=>`<article class="event"><div class="date-tile"><small>${m}</small><strong>${d}</strong></div><div><h3>${n}</h3><p>${l}</p></div><button class="btn" onclick="shiftDetails()">View shift</button></article>`).join('')}</div></section><section class="card"><div class="cardhead"><h2>Your contribution, recognised</h2></div><div class="cardbody"><p class="muted">Keep a record of the time you’ve given to your community.</p><div class="note"><strong>24 verified volunteer hours</strong>Your participation record is ready to preview.</div><button class="btn primary" style="margin-top:18px" onclick="navigate('impact')">View my impact →</button></div></section></div>`}
function certificate(full=false){return `<div class="certificate-mini ${full?'certificate-full':''}"><img src="../public/Ladles-logo.png" alt="Ladles of Love"><div class="eyebrow" style="margin-top:10px">Ladles of Love</div><h3>Certificate of Appreciation</h3><p>Presented to</p><strong>Alex Morgan</strong><p>In recognition of</p><h3 style="font-size:24px">24 hours of volunteer service</h3><p>Across 8 completed shifts · April–September 2026</p><div class="cert-line"></div><p>Thank you for helping us feed communities<br>with dignity and care.</p><p style="margin-top:24px">SAMPLE DESIGN · NOT AN ISSUED CERTIFICATE</p></div>`}
function certificatePreview(){openDialog('Certificate preview',certificate(true)+`<div class="cert-actions"><span class="muted">Sample layout · wording and eligibility to be agreed</span><button class="btn primary" onclick="window.print()">${icon('download')} Print / save PDF</button></div>`)}
function impact(){return header('My impact','Your time, your history, and the difference you’re part of.')+`<div class="personal-stats">${stat('Verified hours','24','Completed attendance only')}${stat('Completed shifts','8','April–September 2026')}${stat('Programmes supported','3','Across your completed events')}</div><div class="grid charts"><section class="card"><div class="cardhead"><div><h2>Your volunteering history</h2><p class="muted">A personal record you can take with you.</p></div></div><div class="table-wrap"><table><thead><tr><th>Event</th><th>Date</th><th>Hours</th></tr></thead><tbody><tr><td>Kitchen prep & packing</td><td>26 Sep</td><td>3 h</td></tr><tr><td>Warehouse packing</td><td>19 Sep</td><td>3 h</td></tr><tr><td>Community food drive</td><td>12 Sep</td><td>3 h</td></tr></tbody></table></div><div class="cardbody"><button class="btn" onclick="hoursPreview()">${icon('download')} Preview hours report</button><p class="muted" style="margin-top:12px">Showing 3 of 8 sample completed shifts.</p></div></section><section class="card"><div class="cardhead"><h2>My certificate</h2></div><div class="cardbody">${certificate()}<div class="cert-actions"><span class="muted">Certificate concept</span><button class="btn primary" onclick="certificatePreview()">Preview →</button></div></div></section></div>`}
function hoursPreview(){openDialog('Volunteer participation record',`<div class="certificate-mini"><div class="eyebrow">Sample hours report</div><h3>Volunteer Participation Record</h3><strong>Alex Morgan</strong><p>1 April–30 September 2026 · 24 verified hours · 8 completed shifts</p><table><thead><tr><th>Date</th><th>Event</th><th>Hours</th></tr></thead><tbody>${['04 Apr','18 Apr','09 May','13 Jun','18 Jul','12 Sep','19 Sep','26 Sep'].map((d,i)=>`<tr><td>${d}</td><td>${['Kitchen prep','Warehouse packing','Community food drive'][i%3]}</td><td>3 h</td></tr>`).join('')}</tbody></table><p>Sample data only. The finished report will use actual completed attendance.</p></div><div class="cert-actions"><span class="muted">Detailed record, separate from the certificate</span><button class="btn primary" onclick="window.print()">Print / save PDF</button></div>`)}
function corporatePreview(){openDialog('Corporate impact report concept',`<div class="eyebrow">Sample company · Reporting period</div><h1>Time given. Impact shared.</h1><div class="grid kpis">${stat('Events supported','4','Sample')}${stat('Attendance instances','62','Sample')}${stat('Group hours','186','Manually recorded')}${stat('Locations','2','Sample')}</div><p class="muted">Proposed report sections: company identity, event activity, attendance, recorded hours and approved impact narrative. Community outcomes would only appear when supported by recorded evidence.</p><p class="print-note">Branded corporate report shown as a later extension; not included in the initial certificate implementation.</p>`)}
function shiftDetails(){openDialog('Kitchen prep & meal packing',`<span class="badge">Sample shift</span><h1 style="margin-top:15px">Give three hours.<br>Make someone’s day.</h1><p>3 October · 09:00–12:00 · Cape Town</p><div class="note"><strong>What you’ll be doing</strong>Help prepare and pack meals with the Ladles of Love team. Wear closed shoes and arrive ten minutes before your shift.</div><div class="cert-actions"><span class="muted">Preview only: no booking will be created.</span><button class="btn primary" onclick="toast('Sample confirmation: your place is reserved.');document.getElementById('dialog').close()">Reserve my place</button></div>`)}
function notifications(){return header('Notifications','Useful updates, with a clear next step.',`<button class="btn" onclick="document.getElementById('unread-dot').hidden=true;toast('Sample notifications marked as read')">Mark all as read</button>`)+`<div class="grid charts"><section class="card"><div class="cardbody">${[['calendar','Your shift is tomorrow','Kitchen prep · Saturday, 09:00–12:00. Here’s everything you need before you arrive.','Reminder · Sample','View shift','shiftDetails()'],['heart','Your hours record is ready','Your completed shifts have been included in your participation record.','Progress update · Sample','View record','hoursPreview()'],['bell','Your booking is confirmed','You have a place at the upcoming community food drive.','Confirmation · Sample','View booking','shiftDetails()']].map(([ic,t,desc,time,action,fn])=>`<article class="notice"><div class="notice-icon">${icon(ic)}</div><div><h3>${t}</h3><p>${desc}</p><small>${time}</small><div style="margin-top:9px"><button class="btn" onclick="${fn}">${action}</button></div></div></article>`).join('')}</div></section><section class="card"><div class="cardhead"><div><h2>${role==='admin'?'Delivery controls':'My preferences'}</h2><p class="muted">Proposed controls · changes are for this preview only</p></div></div><div class="cardbody">${['Booking confirmations','Shift reminders','Event changes'].map(x=>`<label class="toggle-row"><div><strong>${x}</strong><p class="muted">In-app notifications</p></div><input class="switch" type="checkbox" checked aria-label="${x}"></label>`).join('')}<label class="toggle-row"><div><strong>Email reminders</strong><p class="muted">Delivery provider still to be configured</p></div><input class="switch" type="checkbox" disabled aria-label="Email reminders unavailable"></label><button class="btn primary" style="margin-top:18px" onclick="toast('Preview preferences saved for this demonstration only')">Save preferences</button></div></section></div>`}
function events(){return header('Events & opportunities','Clear schedules, visible availability and focused actions.',`<button class="btn primary" onclick="openDialog('Create event · form concept','<p class=muted>Proposed steps: event details → time slots and capacity → review and publish. Warehouse events remain managed by WMS.</p>')">+ New event</button>`)+`<section class="card"><div class="cardbody"><div class="toolbar"><input placeholder="Search events…" aria-label="Search sample events" oninput="document.querySelectorAll('.event-row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(this.value.toLowerCase()))"><span class="badge amber">Sample upcoming events</span></div><div class="table-wrap"><table><thead><tr><th>Event</th><th>Date</th><th>Places reserved</th><th>Management</th><th></th></tr></thead><tbody>${[['Kitchen prep','3 Oct','18 / 30','VMS'],['Warehouse packing','10 Oct','22 / 24','WMS'],['Community food drive','17 Oct','26 / 40','VMS']].map(r=>`<tr class="event-row"><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="badge ${r[3]==='WMS'?'amber':''}">${r[3]==='WMS'?'Managed by WMS':'Published'}</span></td><td><button class="btn" onclick="shiftDetails()">View</button></td></tr>`).join('')}</tbody></table></div></div></section>`}
function dashboard(){return header('Today at Ladles','Keep track of what needs your attention.')+`<div class="grid kpis">${stat('Upcoming events','6','Next 7 days')}${stat('Reserved places','84','Across upcoming shifts')}${stat('Currently clocked in','12','Sample live attendance')}${stat('Group requests','3','Awaiting review')}</div><div class="grid charts"><section class="card"><div class="cardbody"><h2>Coming up next</h2><div class="note"><strong>Kitchen prep · 3 October</strong>18 of 30 places reserved. Event details and attendance tools are ready.</div><button class="btn primary" style="margin-top:15px" onclick="navigate('events')">Manage events</button></div></section><section class="card"><div class="cardbody"><h2>Community activity</h2><p class="muted" style="margin:12px 0">View participation, recorded hours and programme comparisons.</p><button class="btn" onclick="navigate('analytics')">Open analytics →</button></div></section></div>`}
function downloadCsv(){const csv='Data type,Period,Event,Booked,Attended,Verified individual hours\r\n'+[['Kitchen prep - Cape Town',30,28,84],['Warehouse packing - HQ',24,22,66],['Community campaign',40,35,105]].map(r=>['SAMPLE ONLY',period==='3'?'Jul-Sep 2026':'Apr-Sep 2026',...r].join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SAMPLE-event-performance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sample CSV downloaded. Live exports will use real filtered data.')}
function render(){const links=role==='admin'?[['dashboard','dashboard','Dashboard'],['analytics','analytics','Analytics & reports'],['events','calendar','Events'],['certificates','reports','Certificates'],['notifications','bell','Notifications']]:[['home','dashboard','Home'],['impact','heart','My impact'],['attendance','scan','Attendance'],['notifications','bell','Updates']];document.getElementById('nav').innerHTML=links.map(([id,ic,label])=>`<button class="${page===id?'active':''}" ${page===id?'aria-current="page"':''} onclick="navigate('${id}')">${icon(ic)}${label}</button>`).join('');document.getElementById('mobile-nav').innerHTML=links.map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${icon(ic)}${label}</button>`).join('');document.getElementById('nav-label').textContent=role==='admin'?'ADMIN WORKSPACE':'MY VOLUNTEERING';document.getElementById('admin-role').classList.toggle('selected',role==='admin');document.getElementById('volunteer-role').classList.toggle('selected',role==='volunteer');document.getElementById('avatar').textContent=role==='admin'?'FM':'AM';document.getElementById('breadcrumb').textContent=(role==='admin'?'Workspace':'Volunteer portal')+' / '+(links.find(l=>l[0]===page)?.[2]||'Preview');document.getElementById('bell-icon').innerHTML=icon('bell');let html=page==='analytics'?analytics():page==='dashboard'?dashboard():page==='events'?events():page==='home'?home():page==='impact'?impact():page==='notifications'?notifications():page==='certificates'?header('Certificates & participation records','Recognise verified contributions with a thoughtful, useful document.')+`<div class="grid charts"><section class="card"><div class="cardbody">${certificate()}<div class="cert-actions"><span class="muted">Sample preview · eligibility to be agreed</span><button class="btn primary" onclick="certificatePreview()">Preview certificate</button></div></div></section><section class="card"><div class="cardbody"><h2>Clear records. Meaningful recognition.</h2><div class="note"><strong>Certificate of appreciation</strong>A polished recognition document using approved eligibility rules.</div><div class="note"><strong>Detailed participation report</strong>Completed events, dates, locations and verified hours.</div><button class="btn" style="margin-top:16px" onclick="hoursPreview()">Preview hours report</button></div></section></div>`:header('Attendance','Scan the event QR code when you arrive or finish your shift.')+`<section class="card empty-card"><h2>Ready when you are</h2><p class="muted" style="margin:12px 0">In the app, this action opens the existing QR scanner.</p><button class="btn primary" onclick="toast('Scanner design preview — camera access is not requested.')">${icon('scan')} Scan event QR code</button></section>`;document.getElementById('main').innerHTML=`<div class="section">${html}</div>`}
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});render();
</script>
</body>
</html>
