<style>
:root{--red:#d71938;--pink:#fff0f3;--ink:#172b3b;--muted:#6c7c8b;--line:#e2e7ed;--bg:#f5f6fa;--green:#217354}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #e98194;outline-offset:3px}button{transition:background .15s}button:hover:not(:disabled){filter:brightness(.97)}.demo{background:#172b3b;color:#fff;padding:9px 24px;font-size:12px;display:flex;justify-content:space-between;gap:14px}.demo button{background:transparent;border:0;color:#fff;text-decoration:underline}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 38px)}aside{background:white;border-right:1px solid var(--line);padding:27px 18px;position:sticky;top:0;align-self:start;height:100vh}.brand{display:flex;align-items:center;gap:10px;margin-bottom:35px}.brand img{width:40px;height:51px;object-fit:contain}.brand strong{font-size:13px}.eyebrow{color:var(--red);text-transform:uppercase;font-weight:750;letter-spacing:1.5px;font-size:10px}.nav-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin:26px 12px 10px}.nav{display:grid;gap:5px}.nav button{padding:12px;border:0;background:transparent;color:var(--muted);text-align:left;border-radius:8px}.nav button.active{background:var(--pink);color:var(--red);font-weight:650}.aside-note{font-size:12px;color:var(--muted);margin:35px 12px}.workspace{min-width:0}header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:17px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:12px}.avatar{display:inline-grid;place-items:center;background:var(--ink);color:white;width:32px;height:32px;border-radius:50%;margin-left:10px}main{max-width:13 text-align:center;padding:9px 0}.day{min-height:66px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:left;padding:9px;color:var(--ink)}.day strong{display:block}.day small{font-size:9px;display:block;color:var(--green)}.day:disabled{background:#f4f5f7;color:#9aa3ae}.day:disabled small{color:#8b95a0}.day.selected{background:var(--pink);border-color:var(--red);color:var(--red)}.legend{margin-top:16px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}.legend i.grey{background:#a3abb5;margin-left:15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-size:11px;font-weight:650;color:var(--muted)}input,select,textarea{display:block;width:100%;margin-top:6px;border:1px solid #d9e0e8;border-radius:7px;background:white;color:var(--ink);padding:10px 11px;font-size:13px}textarea{resize:vertical;min-height:80px}.full{grid-column:1/-1}.note{padding:14px;background:#f6f7fa;border-radius:8px;font-size:12px;color:var(--muted);margin:16px 0}.note strong{color:var(--ink)}.summary{position:sticky;top:94px;align-self:start}.detail{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.detail span{color:var(--muted)}.detail strong{text-align:right}.big-number{font-size:30px;font-weight:700;line-height:1.2}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:20px}.stat{padding:20px}.stat small{color:var(--muted)}.stat .big-number{margin:8px 0}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th{background:#fafbfc;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}td,th{padding:15px 20px;border-bottom:1px solid var(--line)}td strong{display:block}td small{color:var(--muted)}.admin-day{min-height:90px}.admin-day button{display:block;border:0;border-left:2px solid var(--red);background:var(--pink);color:var(--red);padding:4px 6px;margin-top:4px;border-radius:3px;width:100%;text-align:left;font-size:9px}.tools{display:flex;gap:10px}.tools input{margin:0;max-width:270px}.tools select{margin:0;width:auto}.timeline{border-left:2px solid var(--line);padding-left:18px;display:grid;gap:17px;margin-top:20px}.timeline p{font-size:12px}.timeline small{color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(640px,calc(100% - 30px));max-height:90vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#13263880;backdrop-filter:blur(3px)}dialog .close{padding:6px 10px;font-size:18px}.check{display:flex;align-items:flex-start;gap:10px;font-size:12px}.check input{width:auto;margin:4px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:white;padding:14px 20px;border-radius:8px;z-index:20;box-shadow:0 8px 24px #0002}.toast:empty{display:none}.blank{padding:30px;text-align:center;color:var(--muted)}.success{border-left:3px solid var(--green)}.screen{animation:enter .2s ease-out}@keyframes enter{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:1000px){.shell{grid-template-columns:190px minmax(0,1fr)}main{padding:22px}.activities{grid-template-columns:1fr}.activity{display:grid;grid-template-columns:45px 1fr;column-gap:15px;padding:15px}.activity .symbol{grid-row:1/3;margin:0}.activity small{min-height:0}.split{grid-template-columns:1fr}.summary{position:static}.day{padding:7px;min-height:60px}}@media(max-width:650px){.shell{display:block}aside{position:static;height:auto;padding:15px;border-bottom:1px solid var(--line)}.brand{margin:0 0 12px}.nav-label,.aside-note{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;font-size:12px}header{padding:13px 18px}main{padding:20px 14px}h1{font-size:26px}.fields{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat .big-number{font-size:25px}.body,.cardhead{padding:17px}.day small{font-size:8px}.tools{flex-wrap:wrap}.demo{padding:9px 14px}.admin-day{min-height:82px}.admin-day button{font-size:8px;padding:3px}.cardhead{flex-wrap:wrap}}

/* Current portal palette and shell dimensions, with proposed workflow controls. */
:root{--red:#c91d32;--ink:#222b36;--muted:#697582;--line:#e7e9ee;--bg:#f5f6f9}
.shell{grid-template-columns:228px minmax(0,1fr)}aside{padding:24px 14px}main{max-width:1440px;padding:32px 40px}.brand{padding:0 8px}.brand strong{font-size:14px}.card{border-radius:11px}.cardhead h2{font-weight:800}.btn{min-height:40px}header{min-height:66px}.demo{position:sticky;top:0;z-index:30;align-items:center;flex-wrap:wrap}.demo button{border:1px solid #ffffff40;border-radius:5px;text-decoration:none;padding:4px 9px}.demo .row{gap:6px}header{top:61px}.summary{top:145px}aside{top:61px;height:calc(100vh - 61px)}.auth{max-width:500px;margin:0 auto;padding:55px 28px 40px}.auth .brand{justify-content:center;margin:20px 0 26px}.auth h1{font-size:28px}.auth .fields{grid-template-columns:1fr}.auth label{color:var(--ink);text-transform:none;font-size:12px}.auth input{min-height:46px;background:var(--bg)}.auth-tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border:1px solid var(--line);border-radius:10px;gap:4px;margin-bottom:26px}.auth-tabs button{background:none;border:0;padding:10px 5px;border-radius:7px;font-size:12px;color:var(--muted)}.auth-tabs button.active{background:white;color:var(--red);box-shadow:0 2px 5px #172b3b12}.auth-submit{width:100%;min-height:46px;margin-top:20px}.tabs{display:flex;gap:5px;background:white;border:1px solid var(--line);padding:7px;border-radius:10px;margin-bottom:20px;overflow-x:auto}.tabs button{border:0;background:none;border-radius:7px;padding:12px 15px;white-space:nowrap;font-size:12px;color:var(--muted)}.tabs button.active{background:var(--pink);color:var(--red);font-weight:700}.alert{padding:15px;border:1px solid #ecc39a;background:#fff6e9;border-radius:8px;margin:15px 0;font-size:12px;color:#855016}.error{background:var(--pink);border-color:#efbac3;color:#a11930}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{margin:0;max-width:300px}.badge.overdue{background:#fff0f3;color:#b42336}.badge.payment{background:#fff5e2;color:#956318}.badge.change{background:#edf2fd;color:#34639a}.info-link{color:var(--red);font-size:12px;font-weight:650}.listitem{padding:18px 22px;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.notice.unread{border-left:3px solid var(--red);background:#fffafb}.auth .smallprint{font-size:11px;text-align:center;color:var(--muted);margin-top:18px}.disabled-link{color:var(--muted);font-size:12px;padding:12px;display:block}.contactblock{overflow-wrap:anywhere}.blueprint{border-left:3px solid var(--red)}.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}body.dark{--bg:#111820;--ink:#f0f4f8;--muted:#aebdcb;--line:#354454;--pink:#342127;background:var(--bg)}body.dark aside,body.dark header,body.dark .card,body.dark .tabs,body.dark .activity,body.dark .day,body.dark dialog,body.dark .btn:not(.primary),body.dark input,body.dark select,body.dark textarea{background:#1a2530;color:var(--ink)}body.dark .note,body.dark th,body.dark .auth-tabs{background:#16212c}body.dark .auth-tabs button.active{background:#1a2530}body.dark .notice.unread{background:#342127}body.dark .day:disabled{background:#16212c}body.dark .activity.selected{background:#342127}body.dark .brand img{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}body.dark .alert{background:#332a20;color:#e9c493}body.dark .error{background:#342127;color:#ff9fa7}
@media(max-width:1000px){main{padding:24px}.stats.four{grid-template-columns:repeat(2,1fr)}}
